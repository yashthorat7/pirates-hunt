<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROCODE</title>
    <link rel="stylesheet" href="puzzle.css">
    <script src="puzzle.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <img src="../../assets/uchiha/rock-background.jpg" alt="rock-bg" class="rock-bg">
    <div class="game-part">
        <div class="dial">
            <button class="dial-button 1">1</button>
            <button class="dial-button 2">2</button>
            <button class="dial-button 3">3</button>
            <button class="dial-button 4">4</button>
            <button class="dial-button 5">5</button>
            <button class="dial-button 6">6</button>
            <button class="dial-button 7">7</button>
            <button class="dial-button 8">8</button>
            <button class="dial-button 9 submit-button">
                <img src="../../assets/images/forward-arrow.png" alt=">" class="submit-arrow">
            </button>
        </div>
    </div>

    <div class="second-screen">
        <div class="chatbox">
            <div class="blur-background"></div>
            <div class="message" id="animated-message">
                <span>You r a bro...not a bot, Enter the keys the way you got</span>
            </div>
        </div>
        <img src="../../assets/uchiha/character.png" alt="character" class="character-image">
        <div class="ship-mark">#00</div>
    </div>
</body>
</html>
