<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROCODE</title>
    <link rel="stylesheet" href="puzzle.css">
    <script src="puzzle.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <img src="../../assets/10-manuscripts/rock-background.jpg" alt="rock-bg" class="rock-bg">
    <div class="game-part">
        <div class="dial">
            <button class="dial-button 1">1</button>
            <button class="dial-button 2">2</button>
            <button class="dial-button 3">3</button>
            <button class="dial-button 4">4</button>
            <button class="dial-button 5">5</button>
            <button class="dial-button 6">6</button>
            <button class="dial-button 7">7</button>
            <button class="dial-button 8">8</button>
            <button class="dial-button 9">9</button>
        </div>
    </div>

    <div class="second-screen">
        <div class="chatbox">
            <div class="blur-background"></div>
            <div class="message" id="animated-message">
                <span>1.Home</span>
                <span>2.Hattori</span>
                <span>3.Paradise</span>
                <span>4.Ayase</span>
                <span>5.Goku</span>
                <span>6.Saitama</span>
                <span>7.Yagami</span>
                <span>8.Holo</span>
                <span>9.Tanjiro</span>
            </div>
        </div>
        <img src="../../assets/10-manuscripts/character.png" alt="character" class="character-image">
        <div class="ship-mark">#00</div>
    </div>
</body>
</html>
