<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirates Hunt</title>
    <link rel="stylesheet" href="puzzle.css">
    <link rel="stylesheet" href="../../common/connect.css">
    <script src="../../common/api.js"></script>
    <script src="puzzle.js" defer></script>
    <script src="../../common/hint.js" defer></script>
    <script src="../../common/triggerUnlock.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="wait-overlay">
        <div class="overlay-content">
            <div class="overlay-message">You must wait before play</div>
            <div class="timer">--:--</div>
        </div>
    </div>
    <div class="background">
        <div class="blobs">
            <div class="blob a"></div>
            <div class="blob b"></div>
            <div class="blob c"></div>
            <div class="blob d"></div>
            <div class="blob e"></div>
            <div class="blob f"></div>
        </div>
    </div>

    <div class="game-part">
        <div class="riddle-part">
            <div class="question-title"> #QUESTION 0 </div>
            <img src="" class="riddle">
        </div>
        <div class="options-part"></div>
    </div>

    <div class="connect-container"></div>
</body>

</html>
