<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirates Hunt</title>
    <link rel="stylesheet" href="outro.css">
    <script src="../common/api.js"></script>
    <script src="outro.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>
    <div class="background-container">
        <img src="../assets/images/background1.png" class="background-layer1">
        <img src="../assets/images/background2.png" class="background-layer2">
        <img src="../assets/images/background3.png" class="background-layer3">
        <img src="../assets/images/background4.png" class="background-layer4">
        <img src="../assets/images/background5.png" class="background-layer5">
    </div>
    <img src="../assets/images/main-logo.png" class="main-logo">

    <div class="card-wrapper">
        <div class="card" id="card">
            <img src="../assets/images/card.png" class="card-image">
            <div class="card-front">
                <div class="notification">
                    <span class="ship-code">SHIP 00</span>
                    <img src="../assets/images/video-camera.png" class="camera-icon">
                </div>
                <div class="island-info">
                    <span class="island-name"></span>
                    <span class="clue-text"> </span>
                </div>
                <div class="chat-box">
                    <img src="" alt="character" class="character-image">
                    <span class="chat-message"></span>
                </div>
            </div>

            <div class="card-back">
                <span class="base-mark">Base 0</span>
                <img src="" class="checkpoint-image">
            </div>
        </div>
    </div>
</body>

</html>
