<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROCODE</title>
    <link rel="stylesheet" href="winner.css">
    <script src="winner.js" defer></script>
</head>

<body>
    <div class="ripple-container"></div>

    <div class="title-part">
        <div class="title-text">
            <span class="title-name"></span>
            <span>ISLAND</span>
        </div>
    </div>
    
    <div class="island-part">
        <img src="" alt="island" class="island-image">
    </div>

    <div class="first-screen">
        <div class="register-box">
            <img src="../assets/images/register.png" alt="register" class="register-image">
            <div class="text-box">SHIP</div>
            <input type="number" class="input-box" placeholder="" min="11" max="99">
            <button class="enter-button">
                <img src="../assets/images/forward-arrow.png" alt="forward" class="forward-arrow-image">   
            </button>
        </div>
        <div class="credits">
            <div class="credits-text">
                <span>PIRATES HUNT</span>
                <span>BY</span>
                <span>BROCODE</span>
            </div>
        </div>
    </div>
    
    <div class="second-screen">
        
    </div>
</body>

</html>
