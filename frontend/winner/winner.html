<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BROCODE</title>
        <link rel="stylesheet" href="winner.css" />
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
        <script src="../common/api.js"></script>
        <script src="winner.js" defer></script>
    </head>
    <body>
        <img src="../assets/images/chest.jpg" alt="chest" class="chest-image" />
        <div class="title-part">
            <div class="title-text">
                <span>TREASURE</span>
                <span>CHEST</span>
            </div>
        </div>
        <div class="first-screen">
            <div class="register-box">
                <img src="../assets/images/register.png" alt="register" class="register-image" />
                <div class="text-box">SHIP</div>
                <input type="number" class="input-box" placeholder="" min="11" max="99" />
                <button class="enter-button">
                <img src="../assets/images/forward-arrow.png" alt="forward" class="forward-arrow-image" />
                </button>
            </div>
        </div>
        <div class="victory-screen">
            <div class="message-container">
                <div class="typing-message"></div>
            </div>
        </div>
    </body>
</html>
