<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROCODE</title>
    <link rel="stylesheet" href="lobby.css">
    <script src="lobby.js" defer></script>
</head>

<body>
    <img src="../assets/images/main-logo.png" class="main-logo">
    <div class="first-screen">
        <div class="main box">
            <img src="../assets/lobby/title.png" class="title-image">
            <div class="buttons">
                <button class="lobby-button">Lobby</button>
                <button class="whatsapp-button">Share</button>
            </div>
        </div>
    </div>
    
    <div class="second-screen">
        <div class="chatbox">
            <div class="message" id="animated-message">-</div>
        </div>
        <div class="navigator">
            <button class="backward-button">
                <img src="../assets/images/forward-arrow.png" alt="backward" class="backward-arrow-image">
            </button>
            <div class="dots-container"></div>
            <button class="forward-button">
                <img src="../assets/images/forward-arrow.png" alt="forward" class="forward-arrow-image">
            </button>
        </div>
    </div>

    <div class="third-screen">
        <button class="start-button">Sail the Ship</button>
        <button class="backward2-button">
            <img src="../assets/images/forward-arrow.png" alt="backward" class="backward-arrow-image">
        </button>
    </div>
</body>

</html>
